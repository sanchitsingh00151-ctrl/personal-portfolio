<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="kakashiIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c80000" />
      <stop offset="70%" stop-color="#aa0000" />
      <stop offset="100%" stop-color="#550000" />
    </radialGradient>
  </defs>

  <!-- Outer Black Rim & Crimson Iris Base -->
  <circle cx="250" cy="250" r="238" fill="url(#kakashiIris)" stroke="#050505" stroke-width="22" />

  <!-- 3 Sweeping Curved Blades (Kakashi/Obito Mangekyo Sharingan) -->
  <g fill="#050505">
    <!-- Top Blade curving up-right -->
    <path d="M 250 250 C 250 140 272 50 292 18 C 215 50 188 150 160 215 C 100 248 52 285 30 328 C 72 375 162 368 222 328 C 272 380 352 418 440 395 C 418 312 352 268 250 250 Z" />

    <!-- Center Black Hub Base -->
    <circle cx="250" cy="250" r="70" />
  </g>

  <!-- High-Precision Scythe Blades -->
  <path fill="#050505" d="
    M 250 250
    C 250 130 275 40 292 18
    C 215 55 190 150 162 215
    C 105 250 55 285 30 328
    C 75 378 165 370 224 328
    C 274 382 355 420 440 395
    C 418 310 352 268 250 250
    Z
  " />

  <!-- Center Crimson Red Dot -->
  <circle cx="250" cy="250" r="33" fill="#b00000" stroke="#050505" stroke-width="2" />
</svg>
